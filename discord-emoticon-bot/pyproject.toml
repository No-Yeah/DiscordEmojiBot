[project]
name = "discord-emoticon-bot"
version = "1.0.0"
description = "개인용 Discord 이모티콘 검색/추천 봇"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.7,<3",
    "Pillow>=11",
    "SQLAlchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
postgres = ["asyncpg>=0.30"]

[project.scripts]
emoticon-bot = "app.main:main"
emoticon-cli = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
