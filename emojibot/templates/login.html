<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 | Emoji Bot</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login">
  <img src="{{ url_for('static', filename='logo.png') }}" alt="Discord Emoji Bot">
  <div class="panel">
    <h1>관리자 로그인</h1>
    <p class="hint" style="text-align:center">웹 권한이 있는 디스코드 유저는 디스코드에서 <b>/e web</b> 으로 받은 링크로 들어오세요.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post">
      <label for="u">아이디</label>
      <input id="u" name="username" type="text" autocomplete="username" required autofocus>
      <label for="p">비밀번호</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
      <div class="foot" style="margin-top:20px"><button class="btn primary" style="width:100%">로그인</button></div>
    </form>
  </div>
</div>
</body>
</html>
