{% extends "base.html" %}
{% block title %}관리자 계정{% endblock %}
{% block body %}
<div class="narrow" style="max-width:460px">
<div class="head"><div><h1>관리자 계정</h1><p>바꿀 항목만 입력하세요. 저장하려면 현재 비밀번호가 필요합니다.</p></div></div>
<div class="panel">
  <form data-api="/api/account" data-done="계정 정보를 바꿨습니다.">
    <label for="ac-user">아이디</label>
    <input id="ac-user" name="username" type="text" value="{{ g.me.name }}" autocomplete="username">
    <label for="ac-new">새 비밀번호</label>
    <input id="ac-new" name="new_password" type="password" autocomplete="new-password" minlength="8" placeholder="바꾸지 않으려면 비워두세요">
    <label for="ac-cur">현재 비밀번호 (필수)</label>
    <input id="ac-cur" name="current_password" type="password" autocomplete="current-password" required>
    <div class="foot"><button class="btn primary">계정 저장</button></div>
  </form>
</div>
</div>
{% endblock %}
